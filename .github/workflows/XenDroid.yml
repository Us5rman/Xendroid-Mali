name: Xendroid-Mali 

# Android APK build (arm64-v8a).
# - Pull requests into main (including the claude/* branches of cloud
#   sessions) and manual runs build the test package Xendroid.compose.Mali.opt:
#   debuggable and installed alongside the regular app, the package the A/B
#   tools in tools/ drive.
# - Pushes to main build the regular package Xendroid.compose.Mali and, when
#   the signing secrets are set, publish it as a GitHub release.
# Signing (repository secrets, all optional):
# - release key: ANDROID_KEYSTORE_BASE64, KEY_ALIAS, KEYSTORE_PASSWORD,
#   KEY_PASSWORD (defaults to the keystore password). Needed for releases.
# - test key, used for test builds before the release key: TEST_KEYSTORE_BASE64,
#   TEST_KEY_ALIAS, TEST_KEYSTORE_PASSWORD (also the key password). With the key
#   of the test builds already on the phone, CI builds install over them.
# Without a key the APK is signed with a temporary key made for the run: it
# installs, but not over a build signed with another key, and no release is
# published.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'performance-tests/**'
      - 'tools/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/cache-cleanup.yml'
      - '.github/workflows/checks.yml'
      - '.github/workflows/pages.yml'
      - 'website/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'performance-tests/**'
      - 'tools/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/cache-cleanup.yml'
      - '.github/workflows/checks.yml'
      - '.github/workflows/pages.yml'
      - 'website/**'
  workflow_dispatch:
    inputs:
      package:
        description: >-
          test: Xendroid.compose.Mali.opt (debuggable, side by side);
          regular: Xendroid.compose.Mali
        type: choice
        options: [test, regular]
        default: test

permissions:
  contents: read

concurrency:
  group: xendroid-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request replaces its running build; main builds
  # (releases) always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    container:
      image: ghcr.io/cirruslabs/android-sdk:35

    env:
      ANDROID_SDK_ROOT: /opt/android-sdk-linux
      ANDROID_NDK_VERSION: 29.0.14206865
      CMAKE_VERSION: 3.30.3
      BUILD_TOOLS_VERSION: 35.0.0
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      # Native compile cache (emulator-core/build.gradle adds the launcher).
      USE_CCACHE: 'true'
      CCACHE_COMPILERCHECK: content

    outputs:
      sha: ${{ steps.cfg.outputs.sha }}
      name: ${{ steps.cfg.outputs.name }}
      apk: ${{ steps.sign.outputs.apk }}
      signed_with: ${{ steps.sign.outputs.signed_with }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Build settings
      id: cfg
      env:
        INPUT_PACKAGE: ${{ inputs.package }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        sha=$(git rev-parse --short=8 HEAD)
        if [ "$GITHUB_EVENT_NAME" = push ] || [ "$INPUT_PACKAGE" = regular ]; then
          variant=regular
          name="XenDroid_Release_$sha"
          package=Xendroid.compose.Mali
          package_args=""
        else
          variant=test
          name="XenDroid_test_${PR_NUMBER:+pr${PR_NUMBER}_}$sha"
          package=Xendroid.compose.Mali.opt
          package_args="-PxendroidReleaseIdSuffix=.Mali.opt -PxendroidReleaseDebuggable"
        fi
        {
          echo "sha=$sha"
          echo "variant=$variant"
          echo "name=$name"
          echo "package=$package"
          echo "package_args=$package_args"
        } >> "$GITHUB_OUTPUT"
        # Paths inside the container (github.workspace is the host path).
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "Building $package as $name.apk"

    - name: Install system tools
      run: |
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
          ninja-build python3 glslang-tools spirv-tools ccache

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Cache NDK and CMake
      uses: actions/cache@v4
      with:
        path: |
          /opt/android-sdk-linux/ndk/${{ env.ANDROID_NDK_VERSION }}
          /opt/android-sdk-linux/cmake/${{ env.CMAKE_VERSION }}
        key: sdk-ndk${{ env.ANDROID_NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}

    - name: Install Android SDK packages
      run: |
        yes | sdkmanager --licenses > /dev/null
        for package in "ndk;$ANDROID_NDK_VERSION" "cmake;$CMAKE_VERSION" \
                       "build-tools;$BUILD_TOOLS_VERSION" "platforms;android-35"; do
          dir="$ANDROID_SDK_ROOT/$(echo "$package" | tr ';' '/')"
          [ -d "$dir" ] || sdkmanager "$package" > /dev/null
        done
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ndk${{ env.ANDROID_NDK_VERSION }}-arm64
        max-size: 2G

    - name: Build release APK
      env:
        SHA: ${{ steps.cfg.outputs.sha }}
        PACKAGE_ARGS: ${{ steps.cfg.outputs.package_args }}
      run: |
        chmod +x gradlew
        # PACKAGE_ARGS holds several arguments (unquoted on purpose).
        # The run number orders builds for the in-app updater (versionCode); the
        # release tag below carries the same number.
        ./gradlew --console=plain --build-cache --parallel \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
          -PgitHash="$SHA" -PxendroidVersionCode="$GITHUB_RUN_NUMBER" $PACKAGE_ARGS :app:assembleRelease
        ccache -s || true
        df -h "$GITHUB_WORKSPACE" || true

    - name: Sign APK
      id: sign
      env:
        NAME: ${{ steps.cfg.outputs.name }}
        PACKAGE: ${{ steps.cfg.outputs.package }}
        VARIANT: ${{ steps.cfg.outputs.variant }}
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
        TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
        TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
      run: |
        set -eu
        bt="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"
        unsigned=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
        "$bt/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
        keystore="$RUNNER_TEMP/signing.keystore"
        trap 'rm -f "$keystore"' EXIT
        if [ "$VARIANT" = test ] && [ -n "$TEST_KEYSTORE_BASE64" ] &&
           [ -n "$TEST_KEY_ALIAS" ] && [ -n "$TEST_KEYSTORE_PASSWORD" ]; then
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          signed_with=test
          alias=$TEST_KEY_ALIAS
          KEYSTORE_PASSWORD=$TEST_KEYSTORE_PASSWORD
          KEY_PASSWORD=$TEST_KEYSTORE_PASSWORD
        elif [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          signed_with=release
          alias=$KEY_ALIAS
          KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
        else
          echo "::warning::No signing secrets set: signed with a temporary key, no release is published (see the header of XenDroid.yml)."
          KEYSTORE_PASSWORD=$(head -c 24 /dev/urandom | base64 | tr -d '/+=')
          echo "::add-mask::$KEYSTORE_PASSWORD"
          KEY_PASSWORD=$KEYSTORE_PASSWORD
          export KEYSTORE_PASSWORD
          "${JAVA_HOME:+$JAVA_HOME/bin/}keytool" -genkeypair -keystore "$keystore" \
            -storetype PKCS12 -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env KEYSTORE_PASSWORD -dname "CN=XenDroid CI temporary key"
          signed_with=temporary
          alias=ci
        fi
        # Read by apksigner from the environment, never on the command line.
        export KEYSTORE_PASSWORD KEY_PASSWORD
        "$bt/apksigner" sign --ks "$keystore" --ks-key-alias "$alias" \
          --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
          --out "$NAME.apk" "$RUNNER_TEMP/aligned.apk"
        "$bt/apksigner" verify --print-certs "$NAME.apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
        {
          echo "### $NAME.apk"
          echo "- Package: \`$PACKAGE\`"
          echo "- Signed with the $signed_with key"
          echo "- Size: $(du -h "$NAME.apk" | cut -f1), SHA-256: \`$(sha256sum "$NAME.apk" | cut -d' ' -f1)\`"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "apk=$NAME.apk" >> "$GITHUB_OUTPUT"
        echo "signed_with=$signed_with" >> "$GITHUB_OUTPUT"

    - name: Check APK packaging
      env:
        APK: ${{ steps.sign.outputs.apk }}
      # arm64-only core with JNI_OnLoad, signed, license texts present, no DLL,
      # shader cache, game image or profile data inside.
      run: python3 tools/check-apk.py "$APK" --aapt2 "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/aapt2"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.cfg.outputs.name }}
        path: ${{ steps.sign.outputs.apk }}
        if-no-files-found: error
        retention-days: 14
        compression-level: 0

  release:
    name: GitHub release
    needs: apk
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.apk.outputs.signed_with == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # The merged pull requests' descriptions, for their release notes.
      pull-requests: read

    steps:
    # Before the download: checkout cleans the workspace.
    - name: Checkout the release notes script
      uses: actions/checkout@v4
      with:
        sparse-checkout: tools/release_notes.py
        sparse-checkout-cone-mode: false

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.apk.outputs.name }}

    # The notes the merged pull requests wrote (tools/release_notes.py). If the script
    # fails, the release still goes out, with GitHub's generated notes.
    - name: Release notes
      id: notes
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: XenDroid-v${{ github.run_number }}-${{ needs.apk.outputs.sha }}
        APK: ${{ needs.apk.outputs.apk }}
      run: |
        if python3 tools/release_notes.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --sha "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" --apk "$APK" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/release-notes.md"; then
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::warning::The release notes script failed: GitHub's generated notes are used."
        fi

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        # XenDroid-v<versionCode>-<sha>: parsed by updater/ReleaseTags.kt.
        tag_name: XenDroid-v${{ github.run_number }}-${{ needs.apk.outputs.sha }}
        name: Xendroid Mali ${{ needs.apk.outputs.sha }} (build ${{ github.run_number }})
        target_commitish: ${{ github.sha }}
        body_path: ${{ steps.notes.outputs.path }}
        generate_release_notes: ${{ steps.notes.outputs.path == '' }}
        files: ${{ needs.apk.outputs.apk }}
        
