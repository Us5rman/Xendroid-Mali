name: Xendroid-Mali

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'performance-tests/**'
      - 'tools/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/cache-cleanup.yml'
      - '.github/workflows/checks.yml'
      - '.github/workflows/pages.yml'
      - 'website/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'performance-tests/**'
      - 'tools/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/cache-cleanup.yml'
      - '.github/workflows/checks.yml'
      - '.github/workflows/pages.yml'
      - 'website/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: xendroid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    container:
      image: ghcr.io/cirruslabs/android-sdk:35

    env:
      ANDROID_SDK_ROOT: /opt/android-sdk-linux
      ANDROID_NDK_VERSION: 29.0.14206865
      CMAKE_VERSION: 3.30.3
      BUILD_TOOLS_VERSION: 35.0.0
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      USE_CCACHE: 'true'
      CCACHE_COMPILERCHECK: content

    outputs:
      sha: ${{ steps.cfg.outputs.sha }}
      name: ${{ steps.cfg.outputs.name }}
      apk: ${{ steps.sign.outputs.apk }}
      signed_with: ${{ steps.sign.outputs.signed_with }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Build settings
      id: cfg
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        sha=$(git rev-parse --short=8 HEAD)
        name="XenDroid_Release_${PR_NUMBER:+pr${PR_NUMBER}_}$sha"
        package=Xendroid.compose.Mali
        {
          echo "sha=$sha"
          echo "name=$name"
          echo "package=$package"
        } >> "$GITHUB_OUTPUT"
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "Building $package as $name.apk"

    - name: Install system tools
      run: |
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
          ninja-build python3 glslang-tools spirv-tools ccache

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Cache NDK and CMake
      uses: actions/cache@v4
      with:
        path: |
          /opt/android-sdk-linux/ndk/${{ env.ANDROID_NDK_VERSION }}
          /opt/android-sdk-linux/cmake/${{ env.CMAKE_VERSION }}
        key: sdk-ndk${{ env.ANDROID_NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}

    - name: Install Android SDK packages
      run: |
        yes | sdkmanager --licenses > /dev/null
        for package in "ndk;$ANDROID_NDK_VERSION" "cmake;$CMAKE_VERSION" \
                       "build-tools;$BUILD_TOOLS_VERSION" "platforms;android-35"; do
          dir="$ANDROID_SDK_ROOT/$(echo "$package" | tr ';' '/')"
          [ -d "$dir" ] || sdkmanager "$package" > /dev/null
        done
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ndk${{ env.ANDROID_NDK_VERSION }}-arm64
        max-size: 2G

    - name: Build release APK
      id: build
      env:
        SHA: ${{ steps.cfg.outputs.sha }}
      run: |
        chmod +x gradlew
        ./gradlew --console=plain --build-cache --parallel \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
          -PgitHash="$SHA" -PxendroidVersionCode="$GITHUB_RUN_NUMBER" :app:assembleRelease
        ccache -s || true
        df -h "$GITHUB_WORKSPACE" || true

    - name: Sign APK
      id: sign
      if: steps.build.outcome == 'success'
      env:
        NAME: ${{ steps.cfg.outputs.name }}
        PACKAGE: ${{ steps.cfg.outputs.package }}
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set +e
        bt="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"
        unsigned=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
        if [ -z "$unsigned" ]; then
          echo "::warning::No unsigned APK found from the build step."
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        "$bt/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
        if [ $? -ne 0 ]; then
          echo "::warning::zipalign failed; uploading the unaligned, unsigned APK instead."
          cp "$unsigned" "$NAME.apk"
          echo "apk=$NAME.apk" >> "$GITHUB_OUTPUT"
          echo "signed_with=none" >> "$GITHUB_OUTPUT"
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        keystore="$RUNNER_TEMP/signing.keystore"
        trap 'rm -f "$keystore"' EXIT
        if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n"' | base64 --decode > "$keystore"
          signed_with=release
          alias=$KEY_ALIAS
          KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
        else
          echo "::warning::No signing secrets set: signed with a temporary key, no release is published (see the header of XenDroid.yml)."
          KEYSTORE_PASSWORD=$(head -c 24 /dev/urandom | base64 | tr -d '/+=')
          echo "::add-mask::$KEYSTORE_PASSWORD"
          KEY_PASSWORD=$KEYSTORE_PASSWORD
          export KEYSTORE_PASSWORD
          "${JAVA_HOME:+$JAVA_HOME/bin/}keytool" -genkeypair -keystore "$keystore" \
            -storetype PKCS12 -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env KEYSTORE_PASSWORD -dname "CN=XenDroid CI temporary key"
          signed_with=temporary
          alias=ci
        fi
        export KEYSTORE_PASSWORD KEY_PASSWORD
        "$bt/apksigner" sign --ks "$keystore" --ks-key-alias "$alias" \
          --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
          --out "$NAME.apk" "$RUNNER_TEMP/aligned.apk"
        if [ $? -ne 0 ]; then
          echo "::warning::apksigner failed; uploading the aligned, unsigned APK instead."
          cp "$RUNNER_TEMP/aligned.apk" "$NAME.apk"
          echo "apk=$NAME.apk" >> "$GITHUB_OUTPUT"
          echo "signed_with=none" >> "$GITHUB_OUTPUT"
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        "$bt/apksigner" verify --print-certs "$NAME.apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
        {
          echo "### $NAME.apk"
          echo "- Package: \`$PACKAGE\`"
          echo "- Signed with the $signed_with key"
          echo "- Size: $(du -h "$NAME.apk" | cut -f1), SHA-256: \`$(sha256sum "$NAME.apk" | cut -d' ' -f1)\`"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "apk=$NAME.apk" >> "$GITHUB_OUTPUT"
        echo "signed_with=$signed_with" >> "$GITHUB_OUTPUT"
        echo "ok=true" >> "$GITHUB_OUTPUT"

    - name: Upload APK
      if: always() && steps.sign.outputs.apk != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.cfg.outputs.name }}
        path: ${{ steps.sign.outputs.apk }}
        if-no-files-found: error
        retention-days: 14
        compression-level: 0

    - name: Check APK packaging
      if: steps.sign.outputs.apk != '' && steps.sign.outputs.ok == 'true'
      env:
        APK: ${{ steps.sign.outputs.apk }}
      run: python3 tools/check-apk.py "$APK" --aapt2 "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/aapt2"

  release:
    name: GitHub release
    needs: apk
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.apk.outputs.signed_with == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read

    steps:
    - name: Checkout the release notes script
      uses: actions/checkout@v4
      with:
        sparse-checkout: tools/release_notes.py
        sparse-checkout-cone-mode: false

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.apk.outputs.name }}

    - name: Release notes
      id: notes
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: XenDroid-v${{ github.run_number }}-${{ needs.apk.outputs.sha }}
        APK: ${{ needs.apk.outputs.apk }}
      run: |
        if python3 tools/release_notes.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --sha "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" --apk "$APK" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/release-notes.md"; then
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::warning::The release notes script failed: GitHub's generated notes are used."
        fi

