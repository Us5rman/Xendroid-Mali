name: Generate release keystore (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
    - name: Generate keystore
      run: |
        set -eu
        PASSWORD=$(head -c 24 /dev/urandom | base64 | tr -d '/+=')
        echo "::add-mask::$PASSWORD"

        keytool -genkeypair -v \
          -keystore xendroid-release.keystore \
          -alias xendroid \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storetype PKCS12 \
          -storepass "$PASSWORD" -keypass "$PASSWORD" \
          -dname "CN=XenDroid, OU=Dev, O=Us5rman, L=NA, S=NA, C=NA"

        base64 -w0 xendroid-release.keystore > keystore.b64

        mkdir -p out
        cp xendroid-release.keystore out/
        cp keystore.b64 out/
        echo "$PASSWORD" > out/password.txt

        {
          echo "## Keystore generated"
          echo "- Alias: \`xendroid\`"
          echo "- Download the artifact below, open \`password.txt\` for the password"
          echo "- Put \`keystore.b64\`'s contents into the ANDROID_KEYSTORE_BASE64 secret"
          echo "- Put the password into both KEYSTORE_PASSWORD and KEY_PASSWORD secrets"
          echo "- Put \`xendroid\` into the KEY_ALIAS secret"
          echo "- Back up xendroid-release.keystore and password.txt somewhere safe, then delete this artifact"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload keystore bundle
      uses: actions/upload-artifact@v4
      with:
        name: xendroid-keystore-SECRET-delete-after-use
        path: out/
        retention-days: 1
        
